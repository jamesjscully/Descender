description = "Signer-side no-Plonky3 projection-mask PRF: a from-scratch KoalaBear field plus width-16 Poseidon2 permutation pinned byte-identical to Plonky3's default_koalabear_poseidon2_16, with the pad_seed/slot sponge and q12289 mask derivation matching the account-creation STARK proof. Equivalence KATs prevent signer-side and in-proof PRF drift."

