[package]
name = "descender-account-verifier"
version = "0.1.0"
edition = "2021"
description = "Path 2 account-creation verifier transport shim. Owns the Plonky3 dependency transitively through descender-account-stark so signer-side builds need not. Re-exports descender-account-stark's pinned config as the single source of truth and binds the verified STARK statement to the admission leaf anchors plus role-root and verifier-version export bridges."

[dependencies]
# The Plonky3-bearing relation crate. ALL p3-* deps enter the verifier
# verification path THROUGH this single dependency edge.
descender-account-stark = { path = "../descender-account-stark" }
# Field-element canonicalization for the public-statement wire format.
p3-field = "0.6.1"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
