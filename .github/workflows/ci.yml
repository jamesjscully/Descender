name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lean:
    name: Lean build + theorem and docs audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Documentation authority check
        run: python3 scripts/check_doc_authority.py
      - name: ADR immutable-section check
        run: python3 scripts/check_adr_immutable_sections.py
      - name: Process gate coverage check
        run: python3 scripts/check_process_gate_coverage.py
      - name: Documentation classification inventory
        run: python3 scripts/list_doc_classification_candidates.py --strict --include-status-lines --include-path2-research --include-cryptanalysis-root --include-all-markdown
      - name: Archive mixed-status audit
        run: python3 scripts/check_archive_mixed_status.py --max-mixed 0
      - name: Archive legacy-count audit
        run: python3 scripts/check_archive_legacy_counts.py --max-non-active 10 --max ARCHIVED_TARGET=0 --max LEGACY_FORMAL=4 --max MIXED_STATUS=0 --max NEGATIVE_CONTROL=6 --max SUPERSEDED_DECISION=0 --max SUPERSEDED_TRACKER=0
      - name: Cleanup queue check
        run: python3 scripts/check_cleanup_queue.py
      - name: Retired path absence check
        run: python3 scripts/check_retired_path_absence.py
      - name: Active support import audit
        run: python3 scripts/check_active_support_imports.py --max-unanchored 0
      - name: Active authority stale-term check
        run: python3 scripts/check_active_authority_stale_terms.py
      - name: Legacy code framing check
        run: python3 scripts/check_legacy_code_framing.py
      - name: Tool manifest framing check
        run: python3 scripts/check_tool_manifest_framing.py
      - name: Active source framing check
        run: python3 scripts/check_active_source_framing.py
      - name: Active secret float surface check
        run: python3 scripts/check_active_secret_float_surface.py
      - name: CI/local gate parity check
        run: python3 scripts/check_ci_local_gate_parity.py
      - name: Tracker integrity check
        run: python3 scripts/check_tracker_integrity.py
      - name: Requirement traceability check
        run: python3 scripts/check_requirement_traceability.py
      - name: Wire-format authority check
        run: python3 scripts/check_wire_format_authority.py
      - name: Research automation routing check
        run: python3 scripts/research/check_research_automation_routing.py
      - name: Research queue pivot audit
        run: python3 scripts/research/audit_task_pivot_alignment.py --strict-queue
      - name: Lean build
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
      - name: Semantic theorem audit
        run: lake env lean --run scripts/audit_theorems.lean
      - name: Lean theorem statement drift check
        run: git diff --exit-code audit/lean_theorem_statements.txt

  rust:
    name: Rust workspace check + legacy negative controls
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/parameter-search
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/parameter-search
      - name: Rust all-target check
        run: cargo check --all-targets
      - name: Account STARK payload byte model manifest check
        run: |
          cargo run --quiet --bin path2_account_stark_payload_byte_model_manifest > /tmp/path2_account_stark_payload_byte_model_v1.json
          diff -u ../../formal/kat/path2_account_stark_payload_byte_model_v1.json /tmp/path2_account_stark_payload_byte_model_v1.json
      - name: Account STARK payload KAT boundary manifest check
        run: |
          cargo run --quiet --bin path2_account_stark_payload_kat_manifest > /tmp/path2_account_stark_payload_kat_boundary_v1.json
          diff -u ../../formal/kat/path2_account_stark_payload_kat_boundary_v1.json /tmp/path2_account_stark_payload_kat_boundary_v1.json
      - name: Account-creation frame KAT boundary manifest check
        run: |
          cargo run --quiet --bin path2_account_creation_frame_kat_manifest > /tmp/path2_account_creation_frame_kat_boundary_v1.json
          diff -u ../../formal/kat/path2_account_creation_frame_kat_boundary_v1.json /tmp/path2_account_creation_frame_kat_boundary_v1.json
      - name: Account STARK FRI/QROM residual manifest check
        run: |
          cargo run --quiet --bin path2_account_stark_fri_qrom_residual_manifest > /tmp/path2_account_stark_fri_qrom_residual_v1.json
          diff -u ../../formal/kat/path2_account_stark_fri_qrom_residual_v1.json /tmp/path2_account_stark_fri_qrom_residual_v1.json
      - name: Account STARK FRI/QROM residual consistency check
        run: cargo run --quiet --bin path2_account_stark_fri_qrom_residual_consistency
      - name: Account STARK FRI/QROM domain vector corpus check
        run: |
          cargo run --quiet --bin path2_account_stark_fri_qrom_domain_vectors > /tmp/path2_account_stark_fri_qrom_domain_vectors_v1.json
          diff -u ../../formal/kat/path2_account_stark_fri_qrom_domain_vectors_v1.json /tmp/path2_account_stark_fri_qrom_domain_vectors_v1.json
      - name: Account STARK FRI/QROM domain vector consistency check
        run: cargo run --quiet --bin path2_account_stark_fri_qrom_domain_vector_consistency
      - name: Account STARK FRI/AoK boundary manifest check
        run: |
          cargo run --quiet --bin path2_account_stark_fri_aok_boundary_manifest > /tmp/path2_account_stark_fri_aok_boundary_v1.json
          diff -u ../../formal/kat/path2_account_stark_fri_aok_boundary_v1.json /tmp/path2_account_stark_fri_aok_boundary_v1.json
      - name: Account STARK FRI/AoK boundary consistency check
        run: cargo run --quiet --bin path2_account_stark_fri_aok_boundary_consistency
      - name: Authorization-class binding audit manifest check
        run: |
          cargo run --quiet --bin path2_authorization_class_binding_audit_manifest > /tmp/path2_authorization_class_binding_audit_v1.json
          diff -u ../../formal/kat/path2_authorization_class_binding_audit_v1.json /tmp/path2_authorization_class_binding_audit_v1.json
      - name: Authorization-class binding audit consistency check
        run: cargo run --quiet --bin path2_authorization_class_binding_audit_consistency
      - name: Account-creation sampler timing manifest check
        run: |
          cargo run --quiet --bin path2_account_creation_sampler_timing_manifest > /tmp/path2_account_creation_sampler_timing_v1.json
          diff -u ../../formal/kat/path2_account_creation_sampler_timing_v1.json /tmp/path2_account_creation_sampler_timing_v1.json
      - name: Account-creation sampler timing consistency check
        run: cargo run --quiet --bin path2_account_creation_sampler_timing_consistency
      - name: Account-creation no-export boundary manifest check
        run: |
          cargo run --quiet --bin path2_account_creation_no_export_boundary_manifest > /tmp/path2_account_creation_no_export_boundary_v1.json
          diff -u ../../formal/kat/path2_account_creation_no_export_boundary_v1.json /tmp/path2_account_creation_no_export_boundary_v1.json
      - name: Account-creation no-export boundary consistency check
        run: cargo run --quiet --bin path2_account_creation_no_export_boundary_consistency
      - name: Account-creation no-export vector corpus check
        run: |
          cargo run --quiet --bin path2_account_creation_no_export_vectors > /tmp/path2_account_creation_no_export_vectors_v1.json
          diff -u ../../formal/kat/path2_account_creation_no_export_vectors_v1.json /tmp/path2_account_creation_no_export_vectors_v1.json
      - name: Account-creation no-export vector consistency check
        run: cargo run --quiet --bin path2_account_creation_no_export_vector_consistency
      - name: Account-creation proof boundary manifest check
        run: |
          cargo run --quiet --bin path2_account_creation_proof_boundary_manifest > /tmp/path2_account_creation_proof_boundary_v1.json
          diff -u ../../formal/kat/path2_account_creation_proof_boundary_v1.json /tmp/path2_account_creation_proof_boundary_v1.json
      - name: Account-creation accepted proof-boundary evidence manifest check
        run: |
          cargo run --quiet --features account-creation-stark-verifier --bin path2_account_creation_accepted_proof_boundary_evidence_manifest > /tmp/path2_account_creation_accepted_proof_boundary_evidence_v1.json
          diff -u ../../formal/kat/path2_account_creation_accepted_proof_boundary_evidence_v1.json /tmp/path2_account_creation_accepted_proof_boundary_evidence_v1.json
      - name: Account-creation accepted proof-boundary evidence consistency check
        run: cargo run --quiet --features account-creation-stark-verifier --bin path2_account_creation_accepted_proof_boundary_evidence_consistency
      - name: Account-creation proof-obligation vector corpus check
        run: |
          cargo run --quiet --bin path2_account_creation_proof_obligation_vectors > /tmp/path2_account_creation_proof_obligation_vectors_v1.json
          diff -u ../../formal/kat/path2_account_creation_proof_obligation_vectors_v1.json /tmp/path2_account_creation_proof_obligation_vectors_v1.json
      - name: Account-creation proof-obligation vector consistency check
        run: cargo run --quiet --bin path2_account_creation_proof_obligation_vector_consistency
      - name: Direct QROM/action boundary manifest check
        run: |
          cargo run --quiet --bin path2_direct_qrom_action_boundary_manifest > /tmp/path2_direct_qrom_action_boundary_v1.json
          diff -u ../../formal/kat/path2_direct_qrom_action_boundary_v1.json /tmp/path2_direct_qrom_action_boundary_v1.json
      - name: Direct QROM/action boundary consistency check
        run: cargo run --quiet --bin path2_direct_qrom_action_boundary_consistency
      - name: Direct lifecycle transition vector corpus check
        run: |
          cargo run --quiet --bin path2_direct_lifecycle_transition_vectors > /tmp/path2_direct_lifecycle_transition_vectors_v1.json
          diff -u ../../formal/kat/path2_direct_lifecycle_transition_vectors_v1.json /tmp/path2_direct_lifecycle_transition_vectors_v1.json
      - name: Direct lifecycle transition vector consistency check
        run: cargo run --quiet --bin path2_direct_lifecycle_transition_vector_consistency
      - name: Direct lifecycle profile review check
        run: |
          cargo run --quiet --bin path2_direct_lifecycle_profile_review > /tmp/path2_direct_lifecycle_profile_review_v1.json
          diff -u ../../formal/kat/path2_direct_lifecycle_profile_review_v1.json /tmp/path2_direct_lifecycle_profile_review_v1.json
      - name: Direct lifecycle profile review consistency check
        run: cargo run --quiet --bin path2_direct_lifecycle_profile_review_consistency
      - name: Direct lifecycle profile verification check
        run: |
          cargo run --quiet --bin path2_direct_lifecycle_profile_verification > /tmp/path2_direct_lifecycle_profile_verification_v1.json
          diff -u ../../formal/kat/path2_direct_lifecycle_profile_verification_v1.json /tmp/path2_direct_lifecycle_profile_verification_v1.json
      - name: Direct lifecycle profile verification consistency check
        run: cargo run --quiet --bin path2_direct_lifecycle_profile_verification_consistency
      - name: Direct lifecycle boundary manifest check
        run: |
          cargo run --quiet --bin path2_direct_lifecycle_boundary_manifest > /tmp/path2_direct_lifecycle_boundary_v1.json
          diff -u ../../formal/kat/path2_direct_lifecycle_boundary_v1.json /tmp/path2_direct_lifecycle_boundary_v1.json
      - name: Direct lifecycle boundary consistency check
        run: cargo run --quiet --bin path2_direct_lifecycle_boundary_consistency
      - name: Direct theorem boundary manifest check
        run: |
          cargo run --quiet --bin path2_direct_theorem_boundary_manifest > /tmp/path2_direct_theorem_boundary_v1.json
          diff -u ../../formal/kat/path2_direct_theorem_boundary_v1.json /tmp/path2_direct_theorem_boundary_v1.json
      - name: Direct theorem obligation vector corpus check
        run: |
          cargo run --quiet --bin path2_direct_theorem_obligation_vectors > /tmp/path2_direct_theorem_obligation_vectors_v1.json
          diff -u ../../formal/kat/path2_direct_theorem_obligation_vectors_v1.json /tmp/path2_direct_theorem_obligation_vectors_v1.json
      - name: Direct theorem obligation vector consistency check
        run: cargo run --quiet --bin path2_direct_theorem_obligation_vector_consistency
      - name: Boundary manifest consistency check
        run: cargo run --quiet --bin path2_boundary_manifest_consistency
      - name: Preflight boundary consistency check
        run: cargo run --quiet --bin path2_preflight_boundary_consistency
      - name: Account STARK payload KAT vector corpus check
        run: |
          cargo run --quiet --features account-creation-stark-verifier --bin path2_account_stark_payload_kat_vectors > /tmp/path2_account_stark_payload_kat_vectors_v1.json
          diff -u ../../formal/kat/path2_account_stark_payload_kat_vectors_v1.json /tmp/path2_account_stark_payload_kat_vectors_v1.json
      - name: Account STARK payload KAT vector consistency check
        run: cargo run --quiet --bin path2_account_stark_payload_kat_vector_consistency
      - name: Account-creation frame KAT vector corpus check
        run: |
          cargo run --quiet --bin path2_account_creation_frame_kat_vectors > /tmp/path2_account_creation_frame_kat_vectors_v1.json
          diff -u ../../formal/kat/path2_account_creation_frame_kat_vectors_v1.json /tmp/path2_account_creation_frame_kat_vectors_v1.json
      - name: Account-creation frame KAT consistency check
        run: cargo run --quiet --bin path2_account_creation_frame_kat_consistency
      - name: Account STARK payload byte model consistency check
        run: cargo run --quiet --bin path2_account_stark_payload_byte_model_consistency
      - name: Legacy q12289 negative-control bin tests
        run: cargo test --bin signature_q12289_local_delta_stateful
      - name: Legacy KAT v0 byte-conformance
        run: cargo run --bin signature_q12289_local_delta_stateful -- --kat-check

  active-rust:
    name: Active Path 2 Rust crate checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/descender-mask-prf
            tools/descender-account-stark
            tools/descender-account-verifier
            tools/descender-recursion
      - name: Active Path 2 Rust crate checks
        run: |
          RUSTFLAGS="-D warnings" cargo check --manifest-path tools/descender-mask-prf/Cargo.toml --all-targets
          RUSTFLAGS="-D warnings" cargo check --manifest-path tools/descender-account-stark/Cargo.toml --all-targets
          RUSTFLAGS="-D warnings" cargo check --manifest-path tools/descender-account-verifier/Cargo.toml --all-targets
          RUSTFLAGS="-D warnings" cargo check --manifest-path tools/descender-recursion/Cargo.toml --all-targets
      - name: Active Path 2 fast Rust tests
        run: bash scripts/check_active_rust_fast_tests.sh

  cryptanalysis:
    name: Cryptanalysis/reference artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Estimator/reference constant sync
        run: python3 scripts/research/check_estimator_param_sync.py
      - name: QROM budget artifact regeneration
        run: |
          python3 scripts/research/qrom_challenge_budget_memo.py
          python3 scripts/research/qrom_security_loss_review.py
          python3 scripts/research/pre_third_party_qrom_frame_probe.py
          python3 scripts/research/qrom_multitarget_margin.py
      - name: QROM budget/reference sync
        run: python3 scripts/research/check_qrom_budget_sync.py
      - name: QROM generated artifact drift check
        run: python3 scripts/research/check_qrom_generated_artifact_drift.py
      - name: Fq12 reference irreducibility check
        run: python3 scripts/research/verify_fq12_irreducibility.py
      - name: Checked-core concrete-security support smoke
        run: python3 scripts/research/cryptanalysis_concrete_security_estimate.py
